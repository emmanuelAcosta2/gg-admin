<title>GyG Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0D0E11; --s1:#15171C; --s2:#1D2026; --line:#2B2F38;
  --tx:#F1EFEA; --mu:#8C919C; --mu2:#6A6F7A;
  --or:#F28C1B; --or-ink:#1A1004; --bl:#2F8CFF; --ye:#F5C400;
  --ok:#45C48B; --bad:#E5584F;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 var(--body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line);position:relative}
/* header */
.top{padding:12px 16px 10px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.logos{display:flex}
.logos img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--bg)}
.logos img+img{margin-left:-10px}
.brand{font:italic 700 24px/1 var(--disp);letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font:600 11px/1.2 var(--body);font-style:normal;letter-spacing:.14em;color:var(--mu);margin-top:3px}
.flag{height:6px;flex:none;background:repeating-conic-gradient(var(--tx) 0 25%,var(--bg) 0 50%) 0 0/12px 12px;opacity:.85;border-block:1px solid var(--line)}
main{flex:1;min-height:0;position:relative}
#view{height:100%;overflow-y:auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
.h1{font:700 30px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
/* nav */
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mu);font:600 11px/1 var(--body);letter-spacing:.04em}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--or)}
/* controls */
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:7px;font-weight:600;color:var(--mu)}
.seg button[aria-pressed=true]{background:var(--s2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--s1);color:var(--mu);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;font-weight:600;background:var(--s2);border:1px solid var(--line)}
.btn.pri{background:var(--or);color:var(--or-ink);border-color:var(--or)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.full{width:100%}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--s1);display:grid;place-items:center;color:var(--tx)}
.fab{position:absolute;right:16px;bottom:16px;box-shadow:0 8px 24px #000a;min-height:52px;padding:0 22px;font-size:16px;z-index:5}
/* day strip */
.wk{display:flex;align-items:center;gap:8px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:10px;border:1px solid transparent;color:var(--mu)}
.day b{font:700 20px/1 var(--disp);color:var(--tx)}
.day span{font:600 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase}
.day[aria-pressed=true]{background:var(--s2);border-color:var(--line)}
.day.today b{color:var(--or)}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
/* turno card */
.card{display:flex;gap:12px;padding:12px 14px 12px 12px;background:var(--s1);border:1px solid var(--line);border-radius:12px;width:100%}
.card.cancelado{opacity:.55}
.card.cancelado .tot{text-decoration:line-through}
.time{width:46px;flex:none;font:700 22px/1 var(--disp);padding-top:2px}
.time small{display:block;font:500 11px/1 var(--body);color:var(--mu);margin-top:4px}
.stripe{width:6px;flex:none;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;gap:2px;align-self:stretch}
.stripe i{flex:1}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.plate{font:700 17px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase}
.sub{color:var(--mu);font-size:13px}
.items{font-size:13px;color:var(--tx);opacity:.9}
.cright{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:6px}
.tot{font:700 18px/1 var(--disp);letter-spacing:.02em}
.pill{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.pill.agendado{color:var(--or);border-color:color-mix(in srgb,var(--or) 50%,var(--line))}
.pill.realizado{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.list{display:flex;flex-direction:column;gap:10px}
.gap-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gap-title h3{margin:0;font:700 18px/1 var(--disp);text-transform:uppercase;letter-spacing:.04em}
.empty{padding:28px 16px;text-align:center;color:var(--mu);border:1px dashed var(--line);border-radius:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.cchip{display:inline-flex;align-items:center;gap:6px;margin-right:8px;white-space:nowrap}
/* week rows */
.wrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line);width:100%}
.wrow .t{width:40px;font:700 16px/1 var(--disp);flex:none}
.wrow .p{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .stripe{width:5px;height:24px;flex-direction:row;align-self:auto;width:34px;height:6px}
/* panels */
.panel{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.big{font:700 44px/1 var(--disp);letter-spacing:.01em}
.delta{font:600 13px/1 var(--body);padding:5px 9px;border-radius:99px;background:var(--s2)}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{padding:12px;border-radius:10px;background:var(--s2);display:flex;flex-direction:column;gap:6px}
.kpi b{font:700 24px/1 var(--disp)}
.bars{display:flex;align-items:flex-end;gap:3px;height:92px;border-bottom:1px solid var(--line)}
.bars i{flex:1;background:var(--or);border-radius:2px 2px 0 0;min-height:2px;opacity:.9}
.bars i.z{background:var(--line)}
.axis{display:flex;gap:3px;font:500 10px/1 var(--body);color:var(--mu)}
.axis span{flex:1;text-align:center;overflow:visible;white-space:nowrap}
.row{display:flex;flex-direction:column;gap:7px;padding-block:2px}
.row .r1{display:flex;align-items:center;gap:8px}
.row .r1 .n{flex:1;min-width:0;font-weight:600}
.row .r1 .v{font:700 20px/1 var(--disp)}
.meter{height:6px;border-radius:3px;background:var(--s2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.note{font-size:13px;color:var(--mu)}
.tag{font:600 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:3px 6px;border-radius:4px;background:var(--s2);color:var(--mu)}
.sep{height:1px;background:var(--line);border:0;margin:0}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--s2);border:1px solid var(--line);border-radius:10px}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--s2);display:flex;flex-direction:column;gap:10px}
.item .h{display:flex;align-items:center;gap:8px}
.item .h b{flex:1;min-width:0}
.price{display:flex;align-items:center;gap:8px}
.price input{font:700 20px/1 var(--disp);text-align:right}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;outline:1px solid var(--line)}
.sw[aria-pressed=true]{border-color:var(--bg);outline:2px solid var(--tx)}
.chk{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--s2)}
.chk input{width:20px;height:20px;accent-color:var(--or)}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:#000a}
#sheet[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto;flex:none}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;z-index:90;box-shadow:0 8px 24px #000a}
.toast[hidden]{display:none}
.demo{font-size:12px;color:var(--mu);padding:8px 12px;border:1px dashed var(--line);border-radius:8px}
.logo-big{display:flex;gap:14px;align-items:center}
.logo-big img{width:64px;height:64px;border-radius:50%}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:var(--s1);border:1px solid var(--line);border-radius:12px}
.crow .sw{width:22px;height:22px;flex:none;border:0;outline:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--s2);border:1px solid var(--line);display:grid;place-items:center;font:700 16px/1 var(--disp);color:var(--or);flex:none}
.wgrid{display:flex;flex-direction:column;gap:16px}
.logos img{flex:none}
/* ---------- escritorio ---------- */
@media (min-width:960px){
  .app{max-width:none;border:0;display:grid;grid-template-columns:264px 1fr;grid-template-rows:auto auto 1fr}
  .top{grid-column:1;grid-row:1;background:var(--s1);padding:22px 20px 16px}
  .logos img{width:46px;height:46px}
  .brand{font-size:28px}
  .flag{grid-column:1;grid-row:2;opacity:.6}
  nav{grid-column:1;grid-row:3;grid-template-columns:1fr;align-content:start;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line)}
  nav button{flex-direction:row;gap:12px;padding:12px 14px;border-radius:10px;font-size:15px;letter-spacing:0}
  nav button:hover{background:var(--s2);color:var(--tx)}
  nav button[aria-current=page]{background:var(--s2);color:var(--or);box-shadow:inset 3px 0 0 var(--or)}
  .top,.flag{border-right:1px solid var(--line)}
  main{grid-column:2;grid-row:1/-1}
  #view{padding:32px max(40px,calc((100% - 1120px)/2)) 96px;gap:20px}
  .h1{font-size:38px}
  #view .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px;align-items:start}
  #view .list>.empty,#view .list>.gap-title{grid-column:1/-1}
  .v-agenda>.gap-title:first-child{margin-bottom:0}
  .v-agenda .wk{max-width:640px}
  .wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
  #view .wgrid .list{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--s1);border:1px solid var(--line);border-radius:14px;min-height:180px}
  .wgrid .gap-title{flex-direction:column;align-items:flex-start;gap:4px}
  .wgrid .wrow{flex-wrap:wrap;gap:6px 8px;padding:8px 10px;background:var(--s2)}
  .wgrid .wrow .p{flex:1 1 100%;order:3;white-space:normal;font-size:12px;line-height:1.3}
  .wgrid .wrow .t{width:auto}
  .wgrid .wrow .pill{margin-left:auto;padding:2px 6px}
  .v-reportes{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .v-reportes>:nth-child(-n+3){grid-column:1/-1}
  .v-reportes>.chips{margin-inline:0;padding-inline:0}
  .v-ajustes{display:grid;grid-template-columns:1fr 1fr;align-items:start}
  .v-ajustes>:first-child,.v-ajustes>:last-child{grid-column:1/-1}
  #view.v-ajustes .list{grid-template-columns:1fr!important}
  #view.v-clientes .list{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
  .v-registro>.field{max-width:420px}
  .fab{right:40px;bottom:32px}
  .toast{bottom:32px;left:calc(50% + 132px)}
  #sheet{align-items:center;padding:24px}
  .sheet{max-width:560px;max-height:100%;border:1px solid var(--line);border-radius:18px;padding-top:20px}
  .grab{display:none}
}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const fmt=n=>'$ '+Math.round(n).toLocaleString('es-UY');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const DOWL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MONL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
const TODAY=new Date(2026,8,26), NOWH=13;
const TODAY_S=ymd(TODAY);

/* ---------- datos de ejemplo ---------- */
let cats=[
 {id:'lav',name:'Lavado',color:'#2F8CFF',ref:600},
 {id:'tap',name:'Tapizado',color:'#F28C1B',ref:2200},
 {id:'cer',name:'Cerámico',color:'#A78BFA',ref:9500},
 {id:'ali',name:'Alineación y balanceo',color:'#F5C400',ref:1400},
 {id:'pol',name:'Polarizado',color:'#3DD6C4',ref:3800}];
let combos=[
 {id:'c1',name:'Lavado + Tapizado',cats:['lav','tap'],price:2500},
 {id:'c2',name:'Full Detailing',cats:['lav','tap','cer'],price:11500},
 {id:'c3',name:'Lavado + Alineación',cats:['lav','ali'],price:1800}];
const SIZES={ch:'Chico',me:'Mediano',gr:'Grande',cam:'Camioneta'};
const MULT={ch:1,me:1.15,gr:1.3,cam:1.5};
let clients=[
 {id:1,nombre:'Martín Rodríguez',tel:'099 123 456',notas:'Prefiere turnos por la mañana.'},
 {id:2,nombre:'Lucía Fernández',tel:'098 765 432',notas:''},
 {id:3,nombre:'Diego Pereira',tel:'094 221 908',notas:'Flota chica: camioneta y auto familiar.'},
 {id:4,nombre:'Camila Techera',tel:'091 334 770',notas:''},
 {id:5,nombre:'Nicolás Silva',tel:'099 888 210',notas:''},
 {id:6,nombre:'Valentina Acosta',tel:'096 452 118',notas:'Cliente frecuente, lavado cada 15 días.'},
 {id:7,nombre:'Rodrigo Long',tel:'092 610 447',notas:''},
 {id:8,nombre:'Sofía Martínez',tel:'098 101 332',notas:''}];
let vehicles=[
 {id:1,mat:'SAB 1234',mm:'Chevrolet Onix',tam:'me',cid:1},
 {id:2,mat:'AAC 5521',mm:'Volkswagen Gol',tam:'ch',cid:2},
 {id:3,mat:'SBK 8890',mm:'Toyota Hilux',tam:'cam',cid:3},
 {id:4,mat:'SCD 1020',mm:'Ford Ka',tam:'ch',cid:3},
 {id:5,mat:'SAX 4417',mm:'Renault Duster',tam:'gr',cid:4},
 {id:6,mat:'SBB 7302',mm:'Fiat Cronos',tam:'me',cid:5},
 {id:7,mat:'SAH 2266',mm:'Peugeot 208',tam:'ch',cid:6},
 {id:8,mat:'SCA 9911',mm:'Toyota Corolla',tam:'me',cid:7},
 {id:9,mat:'SBM 3050',mm:'Nissan Kicks',tam:'gr',cid:8}];
const PAGOS=['Efectivo','Transferencia','Débito','Crédito'];

let T=[];
(function seed(){
  let a=20260926;const rnd=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=arr=>arr[Math.floor(rnd()*arr.length)];
  const HOURS=[9,10,11,12,14,15,16,17,18];
  const r50=x=>Math.round(x/50)*50;
  let id=1;
  for(let d=new Date(2026,7,3);d<=new Date(2026,9,2);d=addDays(d,1)){
    if(d.getDay()===0)continue;
    const s=ymd(d),fut=s>TODAY_S;
    const n=fut?1+Math.floor(rnd()*3):2+Math.floor(rnd()*3);
    const hs=[...HOURS].sort(()=>rnd()-.5).slice(0,n).sort((x,y)=>x-y);
    hs.forEach(h=>{
      const v=pick(vehicles),m=MULT[v.tam];
      const single=()=>{const cid=pick(['lav','lav','lav','tap','ali','ali','pol','cer']),c=cats.find(x=>x.id===cid);return {tipo:'cat',ref:c.id,base:c.ref}};
      const combo=()=>{const c=pick(combos);return {tipo:'combo',ref:c.id,base:c.price}};
      const r=rnd();let its;
      if(r<.4)its=[single()];else if(r<.62)its=[combo()];
      else if(r<.8){const c=combo();its=[c,{tipo:'cat',ref:pick(['ali','pol']),base:cats.find(x=>x.id==='ali').ref}];its[1].base=cats.find(x=>x.id===its[1].ref).ref}
      else{const a1=single();let a2=single();its=[a1];if(a2.ref!==a1.ref)its.push(a2)}
      its=its.map(i=>{let p=r50(i.base*m),nota=m!==1?'Ajuste por tamaño: '+SIZES[v.tam]:'';
        if(rnd()<.12){p=r50(p*.9);nota='Descuento cliente frecuente'}
        return {tipo:i.tipo,ref:i.ref,precio:p,nota}});
      let estado;
      if(fut||(s===TODAY_S&&h>=NOWH))estado='agendado';else estado=rnd()<.06?'cancelado':'realizado';
      T.push({id:'t'+id++,date:s,time:pad(h)+':'+(rnd()<.3?'30':'00'),vid:v.id,estado,pago:estado==='realizado'?pick(PAGOS):'',notas:'',items:its});
    });
  }
  // hoy: asegurar turnos pendientes de la tarde, con un combo y un servicio suelto
  T=T.filter(t=>!(t.date===TODAY_S&&t.estado==='agendado'));
  T.push({id:'t'+id++,date:TODAY_S,time:'14:30',vid:6,estado:'agendado',pago:'',notas:'',items:[{tipo:'combo',ref:'c1',precio:2900,nota:'Ajuste por tamaño: Mediano'},{tipo:'cat',ref:'ali',precio:1600,nota:'Ajuste por tamaño: Mediano'}]});
  T.push({id:'t'+id++,date:TODAY_S,time:'16:00',vid:3,estado:'agendado',pago:'',notas:'Llega con barro de campo.',items:[{tipo:'combo',ref:'c2',precio:17250,nota:'Ajuste por tamaño: Camioneta'}]});
  T.push({id:'t'+id++,date:TODAY_S,time:'17:30',vid:7,estado:'agendado',pago:'',notas:'',items:[{tipo:'cat',ref:'lav',precio:600,nota:''}]});
})();

/* ---------- helpers de dominio ---------- */
const cat=id=>cats.find(c=>c.id===id);
const combo=id=>combos.find(c=>c.id===id);
const veh=id=>vehicles.find(v=>v.id===id);
const cli=id=>clients.find(c=>c.id===id);
const tot=t=>t.items.reduce((s,i)=>s+i.precio,0);
const catsOf=i=>i.tipo==='cat'?[i.ref]:combo(i.ref).cats;
const iname=i=>i.tipo==='cat'?cat(i.ref).name:combo(i.ref).name;
const iref=i=>i.tipo==='cat'?cat(i.ref).ref:combo(i.ref).price;
const tcats=t=>[...new Set(t.items.flatMap(catsOf))];
const dot=id=>`<i class="dot" style="background:${cat(id).color}"></i>`;
const stripe=t=>`<span class="stripe" aria-hidden="true">${tcats(t).map(id=>`<i style="background:${cat(id).color}"></i>`).join('')}</span>`;
const itemsTxt=t=>t.items.map(i=>esc(iname(i))).join(' · ');
const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);

/* ---------- períodos ---------- */
const PER=[['dia','Día'],['semana','Semana'],['mes','Mes'],['semestre','Semestre'],['año','Año']];
function range(p,k=0){
  const y=TODAY.getFullYear(),m=TODAY.getMonth();let a,b,label;
  if(p==='dia'){a=addDays(TODAY,k);b=addDays(a,1);label=cap(DOW[a.getDay()])+' '+a.getDate()+' '+MON[a.getMonth()]}
  else if(p==='semana'){a=addDays(monday(TODAY),7*k);b=addDays(a,7);const l=addDays(b,-1);label=a.getDate()+(a.getMonth()!==l.getMonth()?' '+MON[a.getMonth()]:'')+'–'+l.getDate()+' '+MON[l.getMonth()]}
  else if(p==='mes'){a=new Date(y,m+k,1);b=new Date(y,m+k+1,1);label=cap(MONL[a.getMonth()])+' '+a.getFullYear()}
  else if(p==='semestre'){const h=m<6?0:6;a=new Date(y,h+6*k,1);b=new Date(y,h+6*k+6,1);label=(a.getMonth()<6?'1.er':'2.º')+' semestre '+a.getFullYear()}
  else{a=new Date(y+k,0,1);b=new Date(y+k+1,0,1);label=String(a.getFullYear())}
  return {a,b,label};
}
const inR=(s,r)=>s>=ymd(r.a)&&s<ymd(r.b);
const PREVLBL={dia:'ayer',semana:'la semana anterior',mes:'el mes anterior',semestre:'el semestre anterior',año:'el año anterior'};

function stats(p,k=0){
  const r=range(p,k);
  const ts=T.filter(t=>t.estado==='realizado'&&inR(t.date,r));
  const cnt={},rub={};
  cats.forEach(c=>cnt[c.id]={s:0,c:0,via:{}});
  ts.forEach(t=>t.items.forEach(i=>{
    if(i.tipo==='cat'){cnt[i.ref].s++;const key='cat:'+i.ref;rub[key]=(rub[key]||0)+i.precio}
    else{const cb=combo(i.ref);cb.cats.forEach(id=>{cnt[id].c++;cnt[id].via[cb.id]=(cnt[id].via[cb.id]||0)+1});const key='combo:'+cb.id;rub[key]=(rub[key]||0)+i.precio}
  }));
  const total=ts.reduce((s,t)=>s+tot(t),0);
  return {r,ts,cnt,rub,total,n:ts.length,avg:ts.length?total/ts.length:0};
}
const delta=(cur,prev)=>prev?`<span class="delta ${cur>=prev?'up':'down'} num">${cur>=prev?'▲':'▼'} ${Math.abs(Math.round((cur-prev)/prev*100))}%</span>`:'<span class="delta">sin datos previos</span>';

/* ---------- estado de UI ---------- */
const S={tab:'agenda',mode:'dia',sel:TODAY_S,ws:ymd(monday(TODAY)),regP:'mes',regF:'',repP:'mes',cliQ:'',cli:null};
let D=null; // borrador de turno

const ICONS={
 agenda:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
 registro:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 clientes:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.6 3-5.5 6.5-5.5s6 1.9 6.5 5.5M16 4.8a3.4 3.4 0 010 6.4M18 14.8c2 .6 3.2 2.2 3.5 5"/>',
 reportes:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
 ajustes:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>'};
const TABS=[['agenda','Agenda'],['registro','Registro'],['clientes','Clientes'],['reportes','Reportes'],['ajustes','Ajustes']];

/* ---------- render principal ---------- */
function render(){
  $('#nav').innerHTML=TABS.map(([k,l])=>`<button data-a="tab" data-k="${k}" ${S.tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join('');
  $('#fab').hidden=S.tab!=='agenda';
  const v=$('#view'),keep=v.scrollTop;
  v.className='v-'+S.tab+(S.tab==='agenda'?' m-'+S.mode:'');
  v.innerHTML=({agenda:vAgenda,registro:vRegistro,clientes:S.cli?vFicha:vClientes,reportes:vReportes,ajustes:vAjustes})[S.tab]();
  v.scrollTop=keep;
}

/* ----- Agenda ----- */
function turnoCard(t,withDate){
  const v=veh(t.vid),c=cli(v.cid);
  return `<button class="card ${t.estado}" data-a="turno" data-id="${t.id}">
    ${withDate?`<div class="time">${parse(t.date).getDate()}<small>${MON[parse(t.date).getMonth()]}</small></div>`:`<div class="time num">${t.time}</div>`}
    ${stripe(t)}
    <div class="cbody"><span class="plate">${esc(v.mat)}</span><span class="sub">${esc(v.mm)} · ${esc(c.nombre)}</span><span class="items">${itemsTxt(t)}</span></div>
    <div class="cright"><span class="tot num">${fmt(tot(t))}</span><span class="pill ${t.estado}">${t.estado}</span></div>
  </button>`;
}
function vAgenda(){
  const ws=parse(S.ws),wk=[...Array(7)].map((_,i)=>addDays(ws,i));
  const wl=addDays(ws,6);
  const head=`<div class="gap-title"><h1 class="h1">Agenda</h1>
    <div class="seg" role="group" aria-label="Vista"><button data-a="mode" data-k="dia" aria-pressed="${S.mode==='dia'}">Día</button><button data-a="mode" data-k="semana" aria-pressed="${S.mode==='semana'}">Semana</button></div></div>`;
  const nav=`<div class="wk"><button class="icon-btn" data-a="wk" data-n="-7" aria-label="Semana anterior">‹</button>
    <div class="days">${wk.map(d=>{const s=ymd(d),ts=T.filter(t=>t.date===s&&t.estado!=='cancelado');
      const ids=[...new Set(ts.flatMap(tcats))].slice(0,5);
      return `<button class="day ${s===TODAY_S?'today':''}" data-a="sel" data-d="${s}" aria-pressed="${S.mode==='dia'&&s===S.sel}" aria-label="${DOWL[d.getDay()]} ${d.getDate()}"><span>${DOW[d.getDay()]}</span><b class="num">${d.getDate()}</b><span class="dots">${ids.map(id=>`<i style="background:${cat(id).color}"></i>`).join('')}</span></button>`}).join('')}</div>
    <button class="icon-btn" data-a="wk" data-n="7" aria-label="Semana siguiente">›</button></div>`;
  let body='';
  if(S.mode==='dia'){
    const d=parse(S.sel),ts=T.filter(t=>t.date===S.sel).sort(byTime);
    const real=ts.filter(t=>t.estado==='realizado'),ag=ts.filter(t=>t.estado==='agendado');
    body=`<div class="gap-title"><h3>${cap(DOWL[d.getDay()])} ${d.getDate()} de ${MONL[d.getMonth()]}</h3><span class="sub num">${ag.length} agendados · ${fmt(real.reduce((s,t)=>s+tot(t),0))} cobrado</span></div>
      <div class="list">${ts.length?ts.map(t=>turnoCard(t)).join(''):'<div class="empty">No hay turnos este día.<br>Tocá “+ Turno” para agendar.</div>'}</div>`;
  }else{
    body=`<div class="gap-title"><h3>${ws.getDate()} ${MON[ws.getMonth()]} – ${wl.getDate()} ${MON[wl.getMonth()]}</h3><span class="sub">${T.filter(t=>t.date>=ymd(ws)&&t.date<=ymd(wl)&&t.estado==='agendado').length} agendados</span></div>`+
      '<div class="wgrid">'+wk.map(d=>{const s=ymd(d),ts=T.filter(t=>t.date===s).sort(byTime);
        return `<section class="list"><div class="gap-title"><h3 style="${s===TODAY_S?'color:var(--or)':''}">${cap(DOWL[d.getDay()])} ${d.getDate()}</h3><span class="sub">${ts.length?ts.length+' turnos':''}</span></div>
        ${ts.length?ts.map(t=>{const v=veh(t.vid);return `<button class="wrow ${t.estado==='cancelado'?'cancelado':''}" data-a="turno" data-id="${t.id}" style="${t.estado==='cancelado'?'opacity:.5':''}"><span class="t num">${t.time}</span><span class="stripe">${tcats(t).map(id=>`<i style="background:${cat(id).color}"></i>`).join('')}</span><span class="p"><b>${esc(v.mat)}</b> · ${itemsTxt(t)}</span><span class="pill ${t.estado}">${t.estado==='agendado'?'●':t.estado==='realizado'?'✓':'✕'}</span></button>`}).join(''):'<div class="sub" style="padding:2px 2px 6px">Libre</div>'}</section>`}).join('')+'</div>';
  }
  return head+nav+body+'<div class="demo">Datos de ejemplo para la maqueta. “Hoy” es sábado 26 de septiembre de 2026, 13:00.</div>';
}

/* ----- Registro ----- */
function vRegistro(){
  const r=range(S.regP),f=S.regF;
  let ts=T.filter(t=>t.estado==='realizado'&&inR(t.date,r));
  if(f){const [k,id]=f.split(':');ts=ts.filter(t=>t.items.some(i=>k==='cat'?catsOf(i).includes(id):(i.tipo==='combo'&&i.ref===id)))}
  ts.sort((a,b)=>byTime(b,a));
  const total=ts.reduce((s,t)=>s+tot(t),0);
  const groups={};ts.forEach(t=>(groups[t.date]??=[]).push(t));
  return `<h1 class="h1">Registro</h1>
  <div class="chips" role="group" aria-label="Período">${PER.map(([k,l])=>`<button class="chip" data-a="regP" data-k="${k}" aria-pressed="${S.regP===k}">${l}</button>`).join('')}</div>
  <div class="field"><label for="regF">Categoría o combo</label><select id="regF" data-f="regF"><option value="">Todos los trabajos</option>
   <optgroup label="Categorías">${cats.map(c=>`<option value="cat:${c.id}" ${f==='cat:'+c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup>
   <optgroup label="Combos">${combos.map(c=>`<option value="combo:${c.id}" ${f==='combo:'+c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</optgroup></select></div>
  <div class="panel" style="flex-direction:row;justify-content:space-between;align-items:flex-end">
    <div><div class="eyebrow">${range(S.regP).label}</div><div class="big num" style="margin-top:8px">${fmt(total)}</div></div><div class="sub num" style="text-align:right">${ts.length} trabajos</div></div>
  ${f&&f.startsWith('cat:')?'<div class="note">Con este filtro se incluyen trabajos que traen la categoría dentro de un combo. El total es el de cada turno completo.</div>':''}
  ${Object.keys(groups).length?Object.keys(groups).map(s=>{const d=parse(s);return `<section class="list"><div class="gap-title"><h3>${cap(DOW[d.getDay()])} ${d.getDate()} ${MON[d.getMonth()]}</h3><span class="sub num">${fmt(groups[s].reduce((x,t)=>x+tot(t),0))}</span></div>${groups[s].map(t=>turnoCard(t)).join('')}</section>`}).join(''):'<div class="empty">No hay trabajos realizados con estos filtros.</div>'}`;
}

/* ----- Clientes ----- */
function vClientes(){
  const q=S.cliQ.trim().toLowerCase();
  const list=clients.filter(c=>!q||c.nombre.toLowerCase().includes(q)||vehicles.some(v=>v.cid===c.id&&v.mat.toLowerCase().replace(/\s/g,'').includes(q.replace(/\s/g,''))));
  return `<div class="gap-title"><h1 class="h1">Clientes</h1><button class="btn pri sm" data-a="newCli">+ Cliente</button></div>
  <div class="field"><label for="cliQ">Buscar por nombre o matrícula</label><input type="search" id="cliQ" data-f="cliQ" value="${esc(S.cliQ)}" placeholder="Ej: SAB 1234"></div>
  <div class="list">${list.map(c=>{const vs=vehicles.filter(v=>v.cid===c.id);const total=T.filter(t=>t.estado==='realizado'&&vs.some(v=>v.id===t.vid)).reduce((s,t)=>s+tot(t),0);
    return `<button class="crow" data-a="cli" data-id="${c.id}"><span class="avatar">${esc(c.nombre.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span style="flex:1;min-width:0"><b>${esc(c.nombre)}</b><br><span class="sub">${vs.map(v=>esc(v.mat)).join(' · ')}</span></span><span class="tot num">${fmt(total)}</span></button>`}).join('')||'<div class="empty">Sin resultados.</div>'}</div>`;
}
function vFicha(){
  const c=cli(S.cli),vs=vehicles.filter(v=>v.cid===c.id);
  const all=T.filter(t=>vs.some(v=>v.id===t.vid));
  const real=all.filter(t=>t.estado==='realizado');
  const total=real.reduce((s,t)=>s+tot(t),0);
  const last=real.sort((a,b)=>byTime(b,a))[0];
  return `<div class="gap-title"><button class="btn sm" data-a="cliBack">‹ Clientes</button></div>
  <div class="panel"><div style="display:flex;gap:12px;align-items:center"><span class="avatar" style="width:52px;height:52px;font-size:20px">${esc(c.nombre.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><div style="flex:1;min-width:0"><div class="h1" style="font-size:26px">${esc(c.nombre)}</div><div class="sub num" style="user-select:all">${esc(c.tel)}</div></div><button class="btn sm" data-a="copy" data-t="${esc(c.tel)}">Copiar</button></div>
    ${c.notas?`<div class="note">${esc(c.notas)}</div>`:''}
    <div class="kpis"><div class="kpi"><span class="eyebrow">Facturado</span><b class="num">${fmt(total)}</b></div><div class="kpi"><span class="eyebrow">Visitas</span><b class="num">${real.length}</b><span class="sub">${last?'Última: '+parse(last.date).getDate()+' '+MON[parse(last.date).getMonth()]:'Sin visitas'}</span></div></div></div>
  ${vs.map(v=>{const h=all.filter(t=>t.vid===v.id).sort((a,b)=>byTime(b,a));
    return `<section class="list"><div class="gap-title"><h3>${esc(v.mat)} <span class="sub" style="text-transform:none;font-family:var(--body);letter-spacing:0">${esc(v.mm)} · ${SIZES[v.tam]}</span></h3></div>
    ${h.length?h.map(t=>turnoCard(t,true)).join(''):'<div class="empty">Sin historial todavía.</div>'}</section>`}).join('')}
  <button class="btn full" data-a="newVeh" data-id="${c.id}">+ Agregar vehículo</button>`;
}

/* ----- Reportes ----- */
function vReportes(){
  const p=S.repP,cur=stats(p,0),prev=stats(p,-1);
  // buckets del gráfico
  let buckets=[],labels=[];
  if(p==='semana'){for(let i=0;i<7;i++){const d=addDays(cur.r.a,i);buckets.push([ymd(d),ymd(d)]);labels.push('LMMJVSD'[i])}}
  else if(p==='mes'){const n=Math.round((cur.r.b-cur.r.a)/864e5);for(let i=0;i<n;i++){const d=addDays(cur.r.a,i);buckets.push([ymd(d),ymd(d)]);labels.push((i+1)%5===0||i===0?String(i+1):'')}}
  else if(p!=='dia'){const m0=cur.r.a.getMonth(),y=cur.r.a.getFullYear(),n=p==='año'?12:6;for(let i=0;i<n;i++){const a=new Date(y,m0+i,1),b=new Date(y,m0+i+1,1);buckets.push([ymd(a),ymd(addDays(b,-1))]);labels.push(MON[a.getMonth()][0].toUpperCase()+MON[a.getMonth()].slice(1))}}
  const vals=buckets.map(([a,b])=>cur.ts.filter(t=>t.date>=a&&t.date<=b).reduce((s,t)=>s+tot(t),0));
  const mx=Math.max(1,...vals);
  const chart=buckets.length?`<div><div class="bars" role="img" aria-label="Facturación por ${p==='semana'||p==='mes'?'día':'mes'}">${vals.map(v=>`<i class="${v?'':'z'}" style="height:${Math.max(2,v/mx*100)}%"></i>`).join('')}</div><div class="axis" aria-hidden="true">${labels.map(l=>`<span>${l}</span>`).join('')}</div></div>`:'';
  const cn=cats.map(c=>({c,...cur.cnt[c.id]})).sort((a,b)=>(b.s+b.c)-(a.s+a.c));
  const maxN=Math.max(1,...cn.map(x=>x.s+x.c));
  const rubs=Object.entries(cur.rub).map(([k,v])=>{const [t,id]=k.split(':');return {t,id,v}}).sort((a,b)=>b.v-a.v);
  return `<h1 class="h1">Reportes</h1>
  <div class="chips" role="group" aria-label="Período">${PER.map(([k,l])=>`<button class="chip" data-a="repP" data-k="${k}" aria-pressed="${p===k}">${l}</button>`).join('')}</div>
  <div class="panel">
    <div class="eyebrow">Facturación · ${cur.r.label}</div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="big num">${fmt(cur.total)}</div>${delta(cur.total,prev.total)}</div>
    <div class="note">${prev.total?`Contra ${PREVLBL[p]}: ${fmt(prev.total)}`:`Sin turnos realizados en ${PREVLBL[p]}.`}</div>
    ${chart}
    <div class="kpis"><div class="kpi"><span class="eyebrow">Turnos realizados</span><b class="num">${cur.n}</b>${delta(cur.n,prev.n)}</div>
    <div class="kpi"><span class="eyebrow">Ticket promedio</span><b class="num">${fmt(cur.avg)}</b>${delta(cur.avg,prev.avg)}</div></div>
  </div>
  <div class="panel"><div><h2 class="h1" style="font-size:22px">Servicios realizados</h2><div class="note" style="margin-top:6px">Cuenta los servicios sueltos y los que vinieron dentro de un combo.</div></div>
    ${cn.map(x=>{const n=x.s+x.c;return `<div class="row"><div class="r1">${dot(x.c.id)}<span class="n">${esc(x.c.name)}</span><span class="v num">${n}</span></div>
      <div class="meter"><i style="width:${n/maxN*100}%;background:${x.c.color}"></i></div>
      <div class="note num">${x.s} sueltos + ${x.c} en combo${Object.keys(x.via).length?' · '+Object.entries(x.via).map(([id,q])=>esc(combo(id).name)+' ×'+q).join(', '):''}</div></div>`}).join('')}
  </div>
  <div class="panel"><div><h2 class="h1" style="font-size:22px">Facturación por rubro</h2><div class="note" style="margin-top:6px">Cada combo es un rubro propio. El monto de una categoría no incluye lo cobrado en combos.</div></div>
    ${rubs.length?rubs.map(x=>{const isC=x.t==='combo';const nm=isC?combo(x.id).name:cat(x.id).name;
      return `<div class="row"><div class="r1">${isC?combo(x.id).cats.map(dot).join(''):dot(x.id)}<span class="n">${esc(nm)} ${isC?'<span class="tag">Combo</span>':''}</span><span class="v num">${fmt(x.v)}</span></div>
      <div class="meter"><i style="width:${x.v/rubs[0].v*100}%;background:${isC?'var(--tx)':cat(x.id).color};opacity:${isC?.75:1}"></i></div></div>`}).join(''):'<div class="empty">Sin facturación en este período.</div>'}
  </div>`;
}

/* ---------- sheets ---------- */
function sheet(html){const s=$('#sheet');s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;s.hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

function turnoSheet(id,confirmCancel){
  const t=T.find(x=>x.id===id),v=veh(t.vid),c=cli(v.cid),d=parse(t.date);
  sheet(`<div class="shead"><div><div class="eyebrow">${cap(DOWL[d.getDay()])} ${d.getDate()} ${MON[d.getMonth()]} · ${t.time}</div><div class="h1" style="margin-top:8px">${esc(v.mat)}</div><div class="sub">${esc(v.mm)} · ${SIZES[v.tam]}</div></div><span class="pill ${t.estado}">${t.estado}</span></div>
  <button class="crow" data-a="cliFromTurno" data-id="${c.id}"><span class="avatar">${esc(c.nombre.split(' ').map(x=>x[0]).slice(0,2).join(''))}</span><span style="flex:1"><b>${esc(c.nombre)}</b><br><span class="sub num">${esc(c.tel)}</span></span><span class="sub">Ficha ›</span></button>
  <div class="list">${t.items.map(i=>`<div class="item"><div class="h"><span style="display:flex;gap:4px">${catsOf(i).map(dot).join('')}</span><b>${esc(iname(i))}</b><span class="tot num">${fmt(i.precio)}</span></div>
     ${i.tipo==='combo'?`<div class="sub">Incluye: ${combo(i.ref).cats.map(id=>esc(cat(id).name)).join(', ')}</div>`:''}
     ${i.precio!==iref(i)?`<div class="note num">Referencia ${fmt(iref(i))}${i.nota?' · '+esc(i.nota):''}</div>`:''}</div>`).join('')}</div>
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow">Total</span><span class="big num">${fmt(tot(t))}</span></div>
  ${t.estado==='realizado'?`<div class="note">Cobrado con ${esc(t.pago)}.</div>`:''}
  ${t.notas?`<div class="note">${esc(t.notas)}</div>`:''}
  ${t.estado==='agendado'?(confirmCancel?`<div class="panel"><b>¿Cancelar este turno?</b><div class="two"><button class="btn" data-a="turno" data-id="${t.id}">Volver</button><button class="btn bad" data-a="doCancel" data-id="${t.id}">Sí, cancelar</button></div></div>`:
   `<div class="field"><label for="dpago">Medio de pago</label><select id="dpago">${PAGOS.map(p=>`<option>${p}</option>`).join('')}</select></div>
    <button class="btn pri full" data-a="doDone" data-id="${t.id}">Marcar como realizado</button>
    <div class="two"><button class="btn" data-a="editTurno" data-id="${t.id}">Editar</button><button class="btn bad" data-a="askCancel" data-id="${t.id}">Cancelar turno</button></div>`):''}
  <button class="btn full" data-a="close">Cerrar</button>`);
}

/* formulario de turno */
function turnoForm(){
  const ps=D.items.map((i,n)=>`<div class="item"><div class="h"><span style="display:flex;gap:4px">${catsOf(i).map(dot).join('')}</span><b>${esc(iname(i))}</b><button class="btn sm" data-a="rmItem" data-i="${n}" aria-label="Quitar ${esc(iname(i))}">Quitar</button></div>
    <div class="price"><span class="note" style="flex:1">Referencia ${fmt(iref(i))}</span><label class="lbl" for="pr${n}">Cobrado $</label><input type="number" inputmode="numeric" id="pr${n}" data-f="price" data-i="${n}" value="${i.precio}" style="max-width:120px" min="0"></div>
    <div class="field" data-note="${n}" ${i.precio!==iref(i)?'':'hidden'}><label for="nt${n}">Nota del ajuste</label><input type="text" id="nt${n}" data-f="inote" data-i="${n}" value="${esc(i.nota)}" placeholder="Ej: camioneta, suciedad extra, descuento"></div></div>`).join('');
  sheet(`<div class="shead"><div class="h1">${D.id?'Editar turno':'Nuevo turno'}</div><button class="icon-btn" data-a="close" aria-label="Cerrar">✕</button></div>
  <div class="field"><label for="fv">Vehículo</label><select id="fv" data-f="vid">${vehicles.map(v=>`<option value="${v.id}" ${D.vid===v.id?'selected':''}>${esc(v.mat)} · ${esc(v.mm)} — ${esc(cli(v.cid).nombre)}</option>`).join('')}</select><div class="note" id="fvs">Tamaño: ${SIZES[veh(D.vid).tam]}</div></div>
  <div class="two"><div class="field"><label for="fd">Fecha</label><input type="date" id="fd" data-f="date" value="${D.date}"></div><div class="field"><label for="ft">Hora</label><input type="time" id="ft" data-f="time" value="${D.time}"></div></div>
  <div class="field"><span class="lbl">Servicios</span><div class="list" id="fitems">${ps||'<div class="empty">Agregá al menos un servicio o combo.</div>'}</div></div>
  <div class="field"><span class="lbl">Agregar servicio suelto</span><div class="chips" style="margin-inline:0;padding-inline:0;flex-wrap:wrap">${cats.map(c=>`<button class="chip" data-a="addItem" data-t="cat" data-id="${c.id}">${dot(c.id)} ${esc(c.name)}</button>`).join('')}</div></div>
  <div class="field"><span class="lbl">Agregar combo</span><div class="chips" style="margin-inline:0;padding-inline:0;flex-wrap:wrap">${combos.map(c=>`<button class="chip" data-a="addItem" data-t="combo" data-id="${c.id}">${esc(c.name)}</button>`).join('')}</div></div>
  <div class="field"><label for="fp">Medio de pago previsto</label><select id="fp" data-f="pago">${PAGOS.map(p=>`<option ${D.pago===p?'selected':''}>${p}</option>`).join('')}</select></div>
  <div class="field"><label for="fn">Notas</label><textarea id="fn" data-f="notas" placeholder="Ej: dejó las llaves en recepción">${esc(D.notas)}</textarea></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow">Total</span><span class="big num" id="ftot">${fmt(D.items.reduce((s,i)=>s+i.precio,0))}</span></div>
  <button class="btn pri full" data-a="saveTurno">${D.id?'Guardar cambios':'Agendar turno'}</button>`);
}
function newDraft(){D={id:null,date:S.tab==='agenda'?S.sel:TODAY_S,time:'16:00',vid:vehicles[0].id,pago:'Efectivo',notas:'',items:[]};turnoForm()}

function cliSheet(cid){ // alta de cliente (cid null) o vehículo nuevo
  const nv=cid!==null;
  sheet(`<div class="shead"><div class="h1">${nv?'Nuevo vehículo':'Nuevo cliente'}</div><button class="icon-btn" data-a="close" aria-label="Cerrar">✕</button></div>
  ${nv?'':`<div class="field"><label for="cn">Nombre</label><input type="text" id="cn" placeholder="Nombre y apellido"></div>
  <div class="field"><label for="ct">Teléfono</label><input type="text" id="ct" inputmode="tel" placeholder="099 000 000"></div>
  <div class="field"><label for="cno">Notas</label><textarea id="cno"></textarea></div>`}
  <div class="two"><div class="field"><label for="vm">Matrícula</label><input type="text" id="vm" placeholder="SAB 1234"></div><div class="field"><label for="vt">Tamaño</label><select id="vt">${Object.entries(SIZES).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div>
  <div class="field"><label for="vmm">Marca y modelo</label><input type="text" id="vmm" placeholder="Toyota Corolla"></div>
  <button class="btn pri full" data-a="saveCli" data-id="${nv?cid:''}">Guardar</button>`);
}
const PALETTE=['#2F8CFF','#F28C1B','#A78BFA','#F5C400','#3DD6C4','#E5584F','#F472B6','#8BC34A'];
let CE=null;
function catSheet(id){
  CE=id?{...cat(id)}:{id:'',name:'',color:PALETTE[5],ref:0};
  sheet(`<div class="shead"><div class="h1">${id?'Editar categoría':'Nueva categoría'}</div><button class="icon-btn" data-a="close" aria-label="Cerrar">✕</button></div>
  <div class="field"><label for="cnm">Nombre</label><input type="text" id="cnm" value="${esc(CE.name)}" data-f="cename"></div>
  <div class="field"><span class="lbl">Color en la agenda</span><div class="swatches">${PALETTE.map(c=>`<button class="sw" style="background:${c}" data-a="pickColor" data-c="${c}" aria-pressed="${CE.color===c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
  <div class="field"><label for="cref">Precio de referencia (opcional)</label><input type="number" inputmode="numeric" id="cref" value="${CE.ref||''}" data-f="ceref" placeholder="Sin precio de referencia"></div>
  <button class="btn pri full" data-a="saveCat" data-id="${id}">Guardar</button>`);
}
function comboSheet(id){
  CE=id?{...combo(id),cats:[...combo(id).cats]}:{id:'',name:'',cats:[],price:0};
  sheet(`<div class="shead"><div class="h1">${id?'Editar combo':'Nuevo combo'}</div><button class="icon-btn" data-a="close" aria-label="Cerrar">✕</button></div>
  <div class="field"><label for="cbn">Nombre</label><input type="text" id="cbn" value="${esc(CE.name)}" data-f="cename"></div>
  <div class="field"><span class="lbl">Categorías que incluye</span><div class="list" style="gap:8px">${cats.map(c=>`<label class="chk"><input type="checkbox" data-f="cecat" value="${c.id}" ${CE.cats.includes(c.id)?'checked':''}>${dot(c.id)} ${esc(c.name)}</label>`).join('')}</div></div>
  <div class="field"><label for="cbp">Precio de referencia</label><input type="number" inputmode="numeric" id="cbp" value="${CE.price||''}" data-f="ceref"></div>
  <div class="note">El precio del combo no se reparte entre sus categorías.</div>
  <button class="btn pri full" data-a="saveCombo" data-id="${id}">Guardar</button>`);
}

/* ---------- acciones ---------- */
const A={
 tab:d=>{S.tab=d.k;if(d.k!=='clientes')S.cli=null;render();$('#view').scrollTop=0},
 mode:d=>{S.mode=d.k;render()},
 wk:d=>{S.ws=ymd(addDays(parse(S.ws),+d.n));S.sel=ymd(addDays(parse(S.sel),+d.n));render()},
 sel:d=>{S.sel=d.d;S.mode='dia';render()},
 regP:d=>{S.regP=d.k;render()}, repP:d=>{S.repP=d.k;render()},
 turno:d=>turnoSheet(d.id),
 askCancel:d=>turnoSheet(d.id,true),
 doCancel:d=>{T.find(t=>t.id===d.id).estado='cancelado';closeSheet();render();toast('Turno cancelado')},
 doDone:d=>{const t=T.find(x=>x.id===d.id);t.estado='realizado';t.pago=$('#dpago').value;closeSheet();render();toast('Turno realizado: '+fmt(tot(t)))},
 close:closeSheet,
 newTurno:newDraft,
 editTurno:d=>{const t=T.find(x=>x.id===d.id);D=JSON.parse(JSON.stringify(t));turnoForm()},
 addItem:d=>{const base=d.t==='cat'?cat(d.id).ref:combo(d.id).price;D.items.push({tipo:d.t,ref:d.id,precio:base,nota:''});turnoForm()},
 rmItem:d=>{D.items.splice(+d.i,1);turnoForm()},
 saveTurno:()=>{
  if(!D.items.length){toast('Agregá al menos un servicio');return}
  if(!D.date||!D.time){toast('Completá fecha y hora');return}
  if(D.id){Object.assign(T.find(t=>t.id===D.id),D)}else{D.id='t'+Date.now();D.estado='agendado';T.push(D)}
  S.tab='agenda';S.mode='dia';S.sel=D.date;S.ws=ymd(monday(parse(D.date)));closeSheet();render();toast('Turno guardado');
 },
 cli:d=>{S.cli=+d.id;render();$('#view').scrollTop=0},
 cliBack:()=>{S.cli=null;render()},
 cliFromTurno:d=>{closeSheet();S.tab='clientes';S.cli=+d.id;render();$('#view').scrollTop=0},
 newCli:()=>cliSheet(null), newVeh:d=>cliSheet(+d.id),
 saveCli:d=>{
  const mat=$('#vm').value.trim().toUpperCase(),mm=$('#vmm').value.trim();
  let cid=d.id?+d.id:null;
  if(!cid){const n=$('#cn').value.trim();if(!n){toast('Falta el nombre');return}cid=Math.max(...clients.map(c=>c.id))+1;clients.push({id:cid,nombre:n,tel:$('#ct').value.trim(),notas:$('#cno').value.trim()})}
  if(mat)vehicles.push({id:Math.max(...vehicles.map(v=>v.id))+1,mat,mm:mm||'Sin modelo',tam:$('#vt').value,cid});
  closeSheet();S.tab='clientes';S.cli=cid;render();toast('Guardado');
 },
 copy:d=>{const done=()=>toast('Teléfono copiado');try{navigator.clipboard.writeText(d.t).then(done,()=>toast(d.t))}catch(e){toast(d.t)}},
 catEdit:d=>catSheet(d.id), comboEdit:d=>comboSheet(d.id),
 pickColor:d=>{CE.color=d.c;document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===d.c))},
 saveCat:d=>{
  if(!CE.name.trim()){toast('Falta el nombre');return}
  if(d.id)Object.assign(cat(d.id),{name:CE.name,color:CE.color,ref:+CE.ref||0});else cats.push({id:'k'+Date.now(),name:CE.name.trim(),color:CE.color,ref:+CE.ref||0});
  closeSheet();render();toast('Categoría guardada');
 },
 saveCombo:d=>{
  if(!CE.name.trim()||CE.cats.length<2){toast('Poné un nombre y al menos dos categorías');return}
  if(d.id)Object.assign(combo(d.id),{name:CE.name,cats:CE.cats,price:+CE.price||0});else combos.push({id:'c'+Date.now(),name:CE.name.trim(),cats:CE.cats,price:+CE.price||0});
  closeSheet();render();toast('Combo guardado');
 }
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){closeSheet();return}
  const el=e.target.closest('[data-a]');if(!el)return;A[el.dataset.a]?.(el.dataset,el);
});
const onField=e=>{
  const el=e.target,f=el.dataset.f;if(!f)return;
  const i=+el.dataset.i;
  if(f==='regF'){S.regF=el.value;render()}
  else if(f==='cliQ'){S.cliQ=el.value;const p=el.selectionStart;render();const n=$('#cliQ');n.focus();n.setSelectionRange(p,p)}
  else if(f==='vid'){D.vid=+el.value;$('#fvs').textContent='Tamaño: '+SIZES[veh(D.vid).tam]}
  else if(f==='date'||f==='time'||f==='pago'||f==='notas')D[f]=el.value;
  else if(f==='price'){D.items[i].precio=+el.value||0;const it=D.items[i];document.querySelector(`[data-note="${i}"]`).hidden=it.precio===iref(it);$('#ftot').textContent=fmt(D.items.reduce((s,x)=>s+x.precio,0))}
  else if(f==='inote')D.items[i].nota=el.value;
  else if(f==='cename')CE.name=el.value;
  else if(f==='ceref'){CE.ref=CE.price=+el.value||0}
  else if(f==='cecat'){CE.cats=[...document.querySelectorAll('[data-f=cecat]:checked')].map(x=>x.value)}
};
document.addEventListener('input',onField);document.addEventListener('change',onField);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
render();
</script>
